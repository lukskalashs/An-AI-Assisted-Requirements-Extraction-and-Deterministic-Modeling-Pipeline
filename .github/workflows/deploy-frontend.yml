name: Deploy Angular frontend to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - frontend/**
      - .github/workflows/deploy-frontend.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Configure production API URL
        working-directory: frontend
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          node -e "const fs=require('node:fs'); const api=process.env.API_BASE_URL?.trim(); if (!api || !api.startsWith('https://')) { throw new Error('Set the repository variable API_BASE_URL to the HTTPS URL of the deployed Render API.'); } const normalizedApi = api.endsWith('/') ? api.slice(0, -1) : api; fs.writeFileSync('src/environments/environment.production.ts', 'export const environment = { production: true, apiUrl: ' + JSON.stringify(normalizedApi) + ' };\\n');"

      - name: Build
        working-directory: frontend
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: npm run build -- --base-href "/${REPOSITORY_NAME}/"

      - name: Add GitHub Pages SPA fallback
        run: cp frontend/dist/frontend/browser/index.html frontend/dist/frontend/browser/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/frontend/browser

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
